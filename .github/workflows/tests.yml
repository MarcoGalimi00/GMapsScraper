name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests never open a browser, so `playwright install` is not needed here.
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
