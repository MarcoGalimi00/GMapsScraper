[project]
name = "gmaps-places-scraper"
version = "0.2.0"
description = "Collect places of interest from Google Maps, one city and a chosen set of categories at a time."
readme = "README.md"
requires-python = ">=3.11"          # tomllib is in the standard library from 3.11
dependencies = ["playwright>=1.65,<2", "openpyxl>=3.1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gmaps-scraper = "gmaps_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gmaps_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
